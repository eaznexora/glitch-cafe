<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensure mobile scaling is perfect -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glitch Cafe - Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#FAFAFA', // Match more of a white background
              card: '#FFFFFF',
              black: '#000000',
              gray: '#737373',
              border: '#EAEAEA'
            }
          },
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base { 
      html { overflow-x: clip; }
      body { @apply bg-brand-bg text-brand-black font-sans antialiased; overflow-x: clip; min-height: 100vh; } 
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Veg / Non-Veg Icon Shapes */
    .icon-veg { @apply w-4 h-4 border-2 border-green-600 flex items-center justify-center rounded-sm bg-white shrink-0; }
    .icon-veg::after { content: ''; @apply w-1.5 h-1.5 bg-green-600 rounded-full; }
    .icon-nonveg { @apply w-4 h-4 border-2 border-red-700 flex items-center justify-center rounded-sm bg-white shrink-0; }
    .icon-nonveg::after { content: ''; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 5px solid #b91c1c; }
    
    .item-card { @apply bg-brand-card rounded-[15px] p-4 border border-brand-border mb-3 relative; }
    .category-pill { @apply px-5 py-1.5 rounded-md border border-gray-400 text-brand-black bg-white whitespace-nowrap text-[13px] font-bold transition-colors; }
    .category-pill.active { @apply bg-brand-black text-white border-brand-black; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Mobile Container -->
  <div class="max-w-md mx-auto bg-brand-bg min-h-screen relative shadow-2xl" id="app-container">
    
    <!-- MAIN ORDERING VIEW -->
    <div id="view-menu" class="relative pb-24">
      
      <!-- Torn Paper Header -->
      <header class="relative w-full overflow-hidden select-none bg-cover bg-bottom bg-no-repeat pt-5 pb-8 px-4" style="background-image: url('Header.png');">
        <div class="relative z-10 flex items-center justify-between">
          <button class="text-white p-1 hover:opacity-80 transition cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <h1 class="font-extrabold italic text-white text-xl sm:text-2xl tracking-wide text-center drop-shadow-sm uppercase">The Glitch Cafe</h1>
          <div class="w-6"></div>
        </div>
      </header>

      <!-- Welcome -->
      <section id="customer-hero" class="w-full px-5 pt-4 pb-2 bg-[#fbfbfa]">
        <div class="text-left">
          <h2 class="text-[22px] font-bold tracking-tight">Hello, <span id="header-name">Adnan</span>!</h2>
          <p class="text-sm font-bold text-brand-black mt-0.5" id="header-greeting">Good Morning</p>
        </div>
      </section>

      <!-- Sticky Category Horizontal Scroll -->
      <div id="category-tabs-wrapper" class="sticky top-0 z-40 bg-[#fbfbfa] py-2 px-4 border-b border-gray-100 shadow-sm w-full" style="position: -webkit-sticky; position: sticky; top: 0; z-index: 40;">
        <div id="category-bar" class="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth pb-1">
          <!-- Dynamic category pills injected by JS -->
        </div>
      </div>

      <!-- Menu List Area -->
      <main class="w-full px-5 py-4 space-y-6" id="menu-container">
        <!-- Dynamic Menu Items will be injected here via JS -->
      </main>

    </div> <!-- End of #view-menu -->

    <!-- SLIDE-UP CUSTOMIZATION MODAL (INLINE CSS DIRECT OVERRIDES) -->
    <!-- Direct child of body -->
    <div id="customization-backdrop" 
         class="fixed inset-0 z-[998] backdrop-blur-md bg-white/10 opacity-0 transition-all duration-300 ease-out"
         style="display: none;">
    </div>
 
    <div id="customization-modal" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white rounded-t-[32px] p-6 shadow-2xl z-[999] transition-transform duration-300 ease-out" style="transform: translateY(100%);">
      
      <div id="modal-drag-handle" class="w-14 h-1 bg-neutral-300 rounded-full mx-auto mb-5 cursor-pointer"></div>
      <div id="modal-content">
        <!-- Dynamic Item Info -->
        <div id="modal-special-tag-container">
          <div id="modal-special-tag" class="hidden bg-black text-white text-[11px] font-semibold tracking-wider px-3 py-1 rounded-md uppercase inline-flex items-center gap-1 mb-2">
            ✦ THE GLITCH SPECIAL ✦
          </div>
        </div>
        
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <h3 id="modal-item-name" class="text-xl font-extrabold text-black">Item Name</h3>
            <div id="modal-veg-indicator" class="inline-flex items-center justify-center w-4 h-4 border-[1.5px] border-emerald-600 rounded-[3px] p-[2px] ml-2">
              <div class="w-2 h-2 bg-emerald-600 rounded-full"></div>
            </div>
          </div>
          <span id="modal-item-price" class="text-xl font-extrabold text-black">₹0</span>
        </div>
 
        <hr class="border-neutral-100 my-4">

        <!-- Sizes Container -->
        <div id="sizes-section-wrapper">
          <p class="text-sm font-semibold text-neutral-800 mb-3">Select Size</p>
          <div id="modal-sizes" class="grid grid-cols-3 gap-2.5 mb-4"></div>
        </div>
 
        <hr id="sizes-divider" class="border-neutral-100 my-4">

        <!-- Toppings Container -->
        <div id="toppings-section-wrapper">
          <p class="text-sm font-semibold text-neutral-800 mb-3">Select Toppings</p>
          <div id="modal-toppings" class="grid grid-cols-2 gap-x-4 gap-y-3 mb-4"></div>
        </div>
 
        <hr class="border-neutral-100 my-4">

        <p class="text-center text-[11px] text-neutral-500 mb-3">Hot & Fresh in 10–15 minutes</p>
        <div class="flex items-center gap-3">
          <div class="flex items-center justify-between bg-neutral-100 text-black rounded-2xl h-[52px] px-3 w-[120px] shrink-0 border border-neutral-200">
            <button id="modal-qty-minus" class="flex-1 h-full flex items-center justify-center text-2xl font-medium hover:text-gray-500 transition-colors pb-1" onclick="updateModalQty(-1)">-</button>
            <span id="modal-qty" class="w-8 text-center text-base font-bold">1</span>
            <button id="modal-qty-plus" class="flex-1 h-full flex items-center justify-center text-2xl font-medium hover:text-gray-500 transition-colors pb-1" onclick="updateModalQty(1)">+</button>
          </div>
          <button id="modal-add-to-order-btn" class="flex-1 bg-black text-white font-bold text-base h-[52px] rounded-2xl active:scale-[0.98] transition">
            Add to Order
          </button>
        </div>
      </div>
    </div>

  <script>
    lucide.createIcons();
  </script>
  <script src="./src/customer.js"></script>
</body>
</html>
