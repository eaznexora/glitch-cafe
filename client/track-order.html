<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glitch Cafe - Track Your Order</title>
  <script src="./src/config.js"></script>
  <script src="./src/toast.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#FAFAFA',
              card: '#FFFFFF',
              black: '#000000',
              gray: '#737373',
              border: '#EAEAEA'
            }
          },
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base { 
      html { overflow-x: clip; }
      body { @apply bg-brand-bg text-brand-black font-sans antialiased; overflow-x: clip; min-height: 100vh; } 
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .item-card { @apply bg-brand-card rounded-[15px] p-4 border border-brand-border relative; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-md mx-auto bg-brand-bg min-h-screen relative shadow-2xl flex flex-col" id="app-container">
    
    <!-- Header -->
    <header class="relative w-full overflow-hidden select-none bg-cover bg-bottom bg-no-repeat pt-5 pb-8 px-4" style="background-image: url('Header.png');">
      <div class="relative z-10 flex items-center justify-between">
        <button class="text-white p-1 hover:opacity-80 transition cursor-pointer" onclick="window.location.href = window.BASE_PATH + '/customer.html'+window.location.search">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <h1 class="font-extrabold italic text-white text-xl sm:text-2xl tracking-wide text-center drop-shadow-sm uppercase">Track Order</h1>
        <div class="w-6"></div>
      </div>
    </header>

    <div class="flex-1 w-full px-4 pb-12 pt-6 flex flex-col items-center">
      
      <!-- Status Badge Container -->
      <div id="status-container" class="w-full mb-6">
        <!-- Rendered via JS -->
      </div>
      
      <div id="rejection-banner-container" class="w-full"></div>
      
      <h3 class="text-base font-extrabold uppercase mb-3 text-left w-full">ORDER DETAILS</h3>
      
      <div id="cart-list" class="w-full bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col mb-4">
        <!-- Rendered items go here -->
      </div>

      <div class="w-full bg-white rounded-xl shadow-sm border border-gray-100 mb-4 p-4 flex flex-col gap-2">
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-700" id="subtotal-label">Subtotal:</span>
          <span class="font-medium text-gray-700" id="subtotal-amt">₹0</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-700">Extras/Taxes:</span>
          <span class="font-medium text-gray-700" id="extras-amt">₹0</span>
        </div>
        <hr class="border-gray-100 my-1">
        <div class="flex justify-between items-center">
          <span class="font-extrabold text-sm uppercase">TOTAL AMOUNT:</span>
          <span class="font-extrabold text-lg" id="total-amt">₹0</span>
        </div>
      </div>
      
      <button onclick="window.location.href = window.BASE_PATH + '/customer.html'+window.location.search" class="w-full bg-black text-white font-bold text-base py-3.5 px-6 rounded-xl shadow-md hover:bg-neutral-900 active:scale-[0.98] transition-all text-center">
        Back to Menu
      </button>

    </div>

  </div>

  <script src="./src/track-order.js"></script>
</body>
</html>
